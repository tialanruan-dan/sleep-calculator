name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: |
          FILE=$(find . -name package.json -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "KHONG TIM THAY package.json. Cac file hien co:"
            ls -R | head -n 50
            exit 1
          fi
          cd "$(dirname "$FILE")"
          echo "Thu muc du an: $(pwd)"
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sleep-calculator-apk
          path: "**/app-debug.apk"
